<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vazifalar va Qaydlar WebApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .dark .glass-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .animated-check {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .nav-active {
            color: #3b82f6;
            font-weight: 600;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">

    <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col pb-20 relative">
        
        <!-- Header -->
        <header class="p-4 pt-6 flex justify-between items-center sticky top-0 z-20 backdrop-blur-md bg-slate-100/80 dark:bg-slate-900/80 border-b border-slate-200/50 dark:border-slate-800/50">
            <div>
                <div class="flex items-center gap-2">
                    <span id="userAvatar" class="w-8 h-8 rounded-full bg-brand-500 text-white flex items-center justify-center font-bold text-sm">U</span>
                    <div>
                        <h1 class="text-base font-bold leading-tight" id="userName">Salom!</h1>
                        <p class="text-xs text-slate-500 dark:text-slate-400" id="headerSubtitle">Kunlik rejalaringizni belgilang</p>
                    </div>
                </div>
            </div>
            
            <button id="themeToggle" class="p-2.5 rounded-full bg-slate-200/60 dark:bg-slate-800/80 text-slate-700 dark:text-slate-200 active:scale-95 transition-all">
                <i class="fa-solid fa-moon text-lg dark:hidden"></i>
                <i class="fa-solid fa-sun text-lg hidden dark:block text-amber-400"></i>
            </button>
        </header>

        <main class="flex-1 p-4">
            
            <!-- TASKS TAB -->
            <section id="tasksTab" class="space-y-4">
                
                <!-- Day Filter (Horizontal Scroll) -->
                <div>
                    <div class="flex gap-2 overflow-x-auto no-scrollbar py-1 text-xs">
                        <button onclick="setDayFilter('Barchasi')" class="day-btn px-3.5 py-2 rounded-xl bg-brand-500 text-white font-medium shadow-sm transition-all whitespace-nowrap active:scale-95" data-day="Barchasi">Barchasi</button>
                        <button onclick="setDayFilter('Dushanba')" class="day-btn px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition-all whitespace-nowrap active:scale-95 border border-slate-200 dark:border-slate-700" data-day="Dushanba">Du</button>
                        <button onclick="setDayFilter('Seshanba')" class="day-btn px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition-all whitespace-nowrap active:scale-95 border border-slate-200 dark:border-slate-700" data-day="Seshanba">Se</button>
                        <button onclick="setDayFilter('Chorshanba')" class="day-btn px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition-all whitespace-nowrap active:scale-95 border border-slate-200 dark:border-slate-700" data-day="Chorshanba">Chor</button>
                        <button onclick="setDayFilter('Payshanba')" class="day-btn px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition-all whitespace-nowrap active:scale-95 border border-slate-200 dark:border-slate-700" data-day="Payshanba">Pay</button>
                        <button onclick="setDayFilter('Juma')" class="day-btn px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition-all whitespace-nowrap active:scale-95 border border-slate-200 dark:border-slate-700" data-day="Juma">Jum</button>
                        <button onclick="setDayFilter('Shanba')" class="day-btn px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition-all whitespace-nowrap active:scale-95 border border-slate-200 dark:border-slate-700" data-day="Shanba">Sha</button>
                        <button onclick="setDayFilter('Yakshanba')" class="day-btn px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition-all whitespace-nowrap active:scale-95 border border-slate-200 dark:border-slate-700" data-day="Yakshanba">Yak</button>
                    </div>
                </div>

                <!-- Add Task Button Trigger -->
                <button onclick="openAddTaskModal()" class="w-full py-3 px-4 rounded-2xl bg-brand-500 text-white font-medium flex items-center justify-center gap-2 shadow-lg shadow-brand-500/25 active:scale-[0.98] transition-all">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span>Yangi vazifa qo'shish</span>
                </button>

                <!-- Tasks List -->
                <div id="taskList" class="space-y-2.5 pt-2">
                    <!-- Tasks will be rendered dynamically -->
                </div>
                
                <!-- Empty State -->
                <div id="emptyTasks" class="hidden flex-col items-center justify-center py-12 text-center text-slate-400 dark:text-slate-500">
                    <i class="fa-regular fa-clipboard text-5xl mb-3 opacity-60"></i>
                    <p class="text-sm font-medium">Hozircha vazifalar yo'q</p>
                    <p class="text-xs mt-1">Yangi vazifa qo'shish uchun tugmani bosing</p>
                </div>
            </section>

            <section id="notesTab" class="space-y-4 hidden">
                <button onclick="openAddNoteModal()" class="w-full py-3 px-4 rounded-2xl bg-amber-500 text-white font-medium flex items-center justify-center gap-2 shadow-lg shadow-amber-500/25 active:scale-[0.98] transition-all">
                    <i class="fa-solid fa-note-sticky text-sm"></i>
                    <span>Yangi qayd yaratish</span>
                </button>

                <!-- Notes List -->
                <div id="noteList" class="grid grid-cols-1 gap-3 pt-2">
                    <!-- Notes will be rendered dynamically -->
                </div>

                <!-- Empty Notes State -->
                <div id="emptyNotes" class="hidden flex-col items-center justify-center py-12 text-center text-slate-400 dark:text-slate-500">
                    <i class="fa-regular fa-note-sticky text-5xl mb-3 opacity-60"></i>
                    <p class="text-sm font-medium">Hozircha qaydlar yo'q</p>
                    <p class="text-xs mt-1">Muhim fikrlaringizni saqlab qo'ying</p>
                </div>
            </section>
        </main>

        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-t border-slate-200/60 dark:border-slate-800/60 px-6 py-2 flex justify-around items-center z-20">
            <button onclick="switchTab('tasks')" id="tasksTabBtn" class="flex flex-col items-center gap-1 text-brand-500 nav-active transition-all">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span class="text-[11px]">Vazifalar</span>
            </button>
            <button onclick="switchTab('notes')" id="notesTabBtn" class="flex flex-col items-center gap-1 text-slate-400 dark:text-slate-500 transition-all">
                <i class="fa-regular fa-sticky-note text-lg"></i>
                <span class="text-[11px]">Qaydlar</span>
            </button>
        </nav>

        <div id="taskModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200">
            <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-xl transform translate-y-full sm:translate-y-0 transition-transform duration-200">
                <div class="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-700">
                    <h3 class="font-bold text-lg">Yangi Vazifa</h3>
                    <button onclick="closeTaskModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Vazifa nomi</label>
                        <input type="text" id="taskTitleInput" placeholder="Masalan: Kitob o'qish..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Kategoriya</label>
                            <select id="taskCategoryInput" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                                <option value="Ish">💼 Ish</option>
                                <option value="Shaxsiy">👤 Shaxsiy</option>
                                <option value="O'qish">📚 O'qish</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Kuni</label>
                            <select id="taskDayInput" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
                                <option value="Dushanba">Dushanba</option>
                                <option value="Seshanba">Seshanba</option>
                                <option value="Chorshanba">Chorshanba</option>
                                <option value="Payshanba">Payshanba</option>
                                <option value="Juma">Juma</option>
                                <option value="Shanba">Shanba</option>
                                <option value="Yakshanba">Yakshanba</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="pt-2">
                    <button onclick="saveTask()" class="w-full py-3 rounded-xl bg-brand-500 text-white font-medium active:scale-95 transition-all shadow-md shadow-brand-500/30">
                        Saqlash
                    </button>
                </div>
            </div>
        </div>

        <div id="noteModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 pointer-events-none transition-opacity duration-200">
            <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 space-y-4 shadow-xl transform translate-y-full sm:translate-y-0 transition-transform duration-200">
                <div class="flex justify-between items-center pb-2 border-b border-slate-100 dark:border-slate-700">
                    <h3 class="font-bold text-lg" id="noteModalTitle">Yangi Qayd</h3>
                    <button onclick="closeNoteModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Sarlavha</label>
                        <input type="text" id="noteTitleInput" placeholder="Masalan: G'oya..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">Matn</label>
                        <textarea id="noteContentInput" rows="4" placeholder="Qayd mazmunini yozing..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 text-sm resize-none"></textarea>
                    </div>
                </div>

                <div class="pt-2">
                    <button onclick="saveNote()" class="w-full py-3 rounded-xl bg-amber-500 text-white font-medium active:scale-95 transition-all shadow-md shadow-amber-500/30">
                        Saqlash
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Telegram WebApp Initialization
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
            if (tg.colorScheme === 'dark') {
                document.documentElement.classList.add('dark');
            }
        }

        // State Management
        let tasks = JSON.parse(localStorage.getItem('app_tasks')) || [];
        let notes = JSON.parse(localStorage.getItem('app_notes')) || [];
        let activeDayFilter = 'Barchasi';
        let editingNoteId = null;

        // Days mapping
        const daysMap = ['Yakshanba', 'Dushanba', 'Seshanba', 'Chorshanba', 'Payshanba', 'Juma', 'Shanba'];

        window.onload = function() {
            // Setup User Details from Telegram
            if (tg && tg.initDataUnsafe?.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('userName').innerText = `Salom, ${user.first_name}!`;
                document.getElementById('userAvatar').innerText = user.first_name.charAt(0).toUpperCase();
            }

            // Set Current Day by Default
            const todayIndex = new Date().getDay();
            const todayName = daysMap[todayIndex];
            document.getElementById('taskDayInput').value = todayName;

            // Load Saved Theme
            const savedTheme = localStorage.getItem('app_theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            }

            // Initial Render
            renderTasks();
            renderNotes();
        };

        document.getElementById('themeToggle').addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('app_theme', isDark ? 'dark' : 'light');
        });

        // Navigation Tabs Switcher
        function switchTab(tab) {
            const tasksTab = document.getElementById('tasksTab');
            const notesTab = document.getElementById('notesTab');
            const tasksBtn = document.getElementById('tasksTabBtn');
            const notesBtn = document.getElementById('notesTabBtn');

            if (tab === 'tasks') {
                tasksTab.classList.remove('hidden');
                notesTab.classList.add('hidden');
                tasksBtn.classList.add('text-brand-500', 'nav-active');
                tasksBtn.classList.remove('text-slate-400', 'dark:text-slate-500');
                notesBtn.classList.remove('text-amber-500', 'nav-active');
                notesBtn.classList.add('text-slate-400', 'dark:text-slate-500');
            } else {
                tasksTab.classList.add('hidden');
                notesTab.classList.remove('hidden');
                notesBtn.classList.add('text-amber-500', 'nav-active');
                notesBtn.classList.remove('text-slate-400', 'dark:text-slate-500');
                tasksBtn.classList.remove('text-brand-500', 'nav-active');
                tasksBtn.classList.add('text-slate-400', 'dark:text-slate-500');
            }
        }

        function setDayFilter(day) {
            activeDayFilter = day;
            document.querySelectorAll('.day-btn').forEach(btn => {
                if (btn.getAttribute('data-day') === day) {
                    btn.className = "day-btn px-3.5 py-2 rounded-xl bg-brand-500 text-white font-medium shadow-sm transition-all whitespace-nowrap active:scale-95";
                } else {
                    btn.className = "day-btn px-3.5 py-2 rounded-xl bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-medium transition-all whitespace-nowrap active:scale-95 border border-slate-200 dark:border-slate-700";
                }
            });
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById('taskList');
            const emptyState = document.getElementById('emptyTasks');
            list.innerHTML = '';

            let filteredTasks = activeDayFilter === 'Barchasi' 
                ? tasks 
                : tasks.filter(t => t.day === activeDayFilter);

            if (filteredTasks.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                filteredTasks.forEach(task => {
                    const taskEl = document.createElement('div');
                    taskEl.className = `glass-card p-3.5 rounded-2xl flex items-center justify-between gap-3 shadow-sm transition-all duration-200 ${task.completed ? 'opacity-60' : ''}`;
                    
                    const catColors = {
                        'Ish': 'bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400',
                        'Shaxsiy': 'bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-400',
                        'O\'qish': 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400'
                    };

                    taskEl.innerHTML = `
                        <div class="flex items-center gap-3 flex-1 min-w-0">
                            <button onclick="toggleTask('${task.id}')" class="w-6 h-6 rounded-lg border-2 ${task.completed ? 'bg-brand-500 border-brand-500 text-white' : 'border-slate-300 dark:border-slate-600'} flex items-center justify-center transition-all">
                                ${task.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                            </button>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium leading-snug truncate ${task.completed ? 'line-through text-slate-400 dark:text-slate-500' : ''}">${escapeHtml(task.title)}</p>
                                <div class="flex items-center gap-2 mt-1">
                                    <span class="text-[10px] px-2 py-0.5 rounded-md font-medium ${catColors[task.category] || 'bg-slate-100 text-slate-600'}">${task.category}</span>
                                    <span class="text-[10px] text-slate-400"><i class="fa-regular fa-calendar-check mr-1"></i>${task.day}</span>
                                </div>
                            </div>
                        </div>
                        <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-red-500 p-1.5 active:scale-90 transition-all">
                            <i class="fa-regular fa-trash-can text-sm"></i>
                        </button>
                    `;
                    list.appendChild(taskEl);
                });
            }
        }

        function openAddTaskModal() {
            document.getElementById('taskTitleInput').value = '';
            const modal = document.getElementById('taskModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeTaskModal() {
            const modal = document.getElementById('taskModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function saveTask() {
            const title = document.getElementById('taskTitleInput').value.trim();
            const category = document.getElementById('taskCategoryInput').value;
            const day = document.getElementById('taskDayInput').value;

            if (!title) return;

            const newTask = {
                id: Date.now().toString(),
                title,
                category,
                day,
                completed: false
            };

            tasks.unshift(newTask);
            localStorage.setItem('app_tasks', JSON.stringify(tasks));
            renderTasks();
            closeTaskModal();
        }

        function toggleTask(id) {
            tasks = tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t);
            localStorage.setItem('app_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            localStorage.setItem('app_tasks', JSON.stringify(tasks));
            renderTasks();
        }

        function renderNotes() {
            const list = document.getElementById('noteList');
            const emptyState = document.getElementById('emptyNotes');
            list.innerHTML = '';

            if (notes.length === 0) {
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                notes.forEach(note => {
                    const noteEl = document.createElement('div');
                    noteEl.className = "glass-card p-4 rounded-2xl relative space-y-2 shadow-sm border-l-4 border-l-amber-500";
                    noteEl.innerHTML = `
                        <div class="flex justify-between items-start gap-2">
                            <h4 class="font-bold text-sm text-slate-800 dark:text-slate-100 truncate">${escapeHtml(note.title)}</h4>
                            <div class="flex items-center gap-1">
                                <button onclick="editNote('${note.id}')" class="text-slate-400 hover:text-amber-500 p-1 active:scale-90 transition-all">
                                    <i class="fa-regular fa-pen-to-square text-xs"></i>
                                </button>
                                <button onclick="deleteNote('${note.id}')" class="text-slate-400 hover:text-red-500 p-1 active:scale-90 transition-all">
                                    <i class="fa-regular fa-trash-can text-xs"></i>
                                </button>
                            </div>
                        </div>
                        <p class="text-xs text-slate-600 dark:text-slate-300 whitespace-pre-line leading-relaxed">${escapeHtml(note.content)}</p>
                        <p class="text-[10px] text-slate-400 text-right pt-1">${note.date}</p>
                    `;
                    list.appendChild(noteEl);
                });
            }
        }

        function openAddNoteModal() {
            editingNoteId = null;
            document.getElementById('noteModalTitle').innerText = "Yangi Qayd";
            document.getElementById('noteTitleInput').value = '';
            document.getElementById('noteContentInput').value = '';
            const modal = document.getElementById('noteModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;

            editingNoteId = id;
            document.getElementById('noteModalTitle').innerText = "Qaydni tahrirlash";
            document.getElementById('noteTitleInput').value = note.title;
            document.getElementById('noteContentInput').value = note.content;

            const modal = document.getElementById('noteModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        function closeNoteModal() {
            const modal = document.getElementById('noteModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
        }

        function saveNote() {
            const title = document.getElementById('noteTitleInput').value.trim();
            const content = document.getElementById('noteContentInput').value.trim();

            if (!title || !content) return;

            const dateStr = new Date().toLocaleDateString('uz-UZ', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

            if (editingNoteId) {
                notes = notes.map(n => n.id === editingNoteId ? { ...n, title, content, date: dateStr } : n);
            } else {
                const newNote = {
                    id: Date.now().toString(),
                    title,
                    content,
                    date: dateStr
                };
                notes.unshift(newNote);
            }

            localStorage.setItem('app_notes', JSON.stringify(notes));
            renderNotes();
            closeNoteModal();
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            localStorage.setItem('app_notes', JSON.stringify(notes));
            renderNotes();
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.innerText = text;
            return div.innerHTML;
        }
    </script>
